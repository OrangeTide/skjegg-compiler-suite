name: Build and Deploy Manual

on:
  push:
    branches: [main]
    paths:
      - 'doc/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; a newer push supersedes a running one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Pinned, not ubuntu-latest: see the note in ci.yml.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-texgyre

      - name: Install Pandoc
        # Pinned to match the version used in local development. The distro apt
        # pandoc is older and line-wraps a long Markdown table cell so a "/ ..."
        # token can land at the start of a generated typst line, which typst then
        # reads as a description-list term and rejects ("expected colon"). A
        # pinned release keeps CI in step with a local build, so running
        # "make -C doc all" locally is a faithful preflight for this job.
        run: |
          curl -fsSL https://github.com/jgm/pandoc/releases/download/3.9.0.2/pandoc-3.9.0.2-linux-amd64.tar.gz \
            | tar -xz --strip-components=2 -C /usr/local/bin pandoc-3.9.0.2/bin/pandoc

      - name: Install Typst
        run: |
          curl -fsSL https://github.com/typst/typst/releases/latest/download/typst-x86_64-unknown-linux-musl.tar.xz \
            | tar -xJ --strip-components=1 -C /usr/local/bin/

      - name: Build the manual (HTML + PDF)
        run: make -C doc all

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/manual

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
