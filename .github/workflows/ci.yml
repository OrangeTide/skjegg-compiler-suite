name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # check-all overrides the MIPS toolchain to the Debian mipsel-linux-gnu
    # binutils, since the Makefile defaults to a bare-metal mipsel-none-elf
    # cross that is not an apt package.  test-f32-diff-mips is the only MIPS
    # user in check-all.
    env:
      MIPS_AS: mipsel-linux-gnu-as
      MIPS_LD: mipsel-linux-gnu-ld
    steps:
      - uses: actions/checkout@v6

      # check-all spans every backend, so install every cross toolchain it
      # touches (m68k, riscv64, aarch64, mipsel), NASM for x86, and the full
      # qemu-user set (m68k / riscv32 / i386 / x86_64 / aarch64 / mipsel).
      - name: Install cross toolchains and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-m68k-linux-gnu binutils-m68k-linux-gnu \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-mipsel-linux-gnu binutils-mipsel-linux-gnu \
            nasm qemu-user

      - name: Build all tools
        run: make

      - name: GC unit tests
        run: make test-gc

      # The full qemu matrix: every front end x backend suite, the IR-builder
      # integration tests (fpu / i64 / ops / f32-diff), the RV32 binutils-free
      # toolchain, and the Excelsior codegen tiers.
      - name: Full test matrix
        run: make check-all
