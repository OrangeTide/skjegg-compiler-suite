<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>skjegg playground</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel2: #1e222b;
    --border: #2a2f3a;
    --fg: #d7dce5;
    --dim: #8b93a3;
    --accent: #5ab0f2;
    --green: #5fd38d;
    --red: #f27a7a;
    --mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
    --sans: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--sans);
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: .2px; }
  header h1 .dim { color: var(--dim); font-weight: 400; }
  header .spacer { flex: 1; }
  label.sel { font-size: 12px; color: var(--dim); display: flex; align-items: center; gap: 6px; }
  select, button {
    font-family: var(--sans); font-size: 13px; color: var(--fg);
    background: var(--panel2); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 12px; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: #1d3650; border-color: #2d5273; color: #cfe6ff; }
  button.primary:hover:not(:disabled) { border-color: var(--accent); }
  main { flex: 1; display: flex; min-height: 0; }
  .pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .editor-pane { flex: 1.3; border-right: 1px solid var(--border); }
  .console-pane { flex: 1; }
  .pane-head {
    font-size: 11px; text-transform: uppercase; letter-spacing: .8px;
    color: var(--dim); padding: 8px 14px; background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .editor-wrap { flex: 1; display: flex; overflow: hidden; background: #0c0e12; }
  .gutter {
    padding: 12px 8px 12px 14px; text-align: right; color: #4a5160;
    font-family: var(--mono); font-size: 13px; line-height: 1.55;
    user-select: none; background: #0c0e12; white-space: pre; overflow: hidden;
  }
  /* The editor is a transparent textarea layered over a highlighted <pre>; both
     share identical metrics so the caret sits exactly on the colored text. */
  .code-layer { position: relative; flex: 1; overflow: hidden; }
  #hl, #editor {
    margin: 0; padding: 12px 14px; border: 0;
    font-family: var(--mono); font-size: 13px; line-height: 1.55;
    tab-size: 2; white-space: pre; letter-spacing: 0;
  }
  #hl {
    position: absolute; inset: 0; overflow: hidden; pointer-events: none;
    color: var(--fg); background: #0c0e12; z-index: 0;
  }
  #editor {
    position: absolute; inset: 0; resize: none; outline: 0; overflow: auto;
    background: transparent; color: transparent; caret-color: var(--fg); z-index: 1;
  }
  #editor[readonly] { caret-color: transparent; }
  .tok-com { color: var(--dim); font-style: italic; }
  .tok-str { color: #c3e88d; }
  .tok-num { color: #f78c6c; }
  .tok-kw  { color: #82aaff; }
  .tok-pre { color: #c792ea; }
  #console {
    flex: 1; margin: 0; padding: 12px 16px; overflow: auto;
    font-family: var(--mono); font-size: 13px; line-height: 1.5;
    white-space: pre-wrap; word-break: break-word; background: #0c0e12;
  }
  .log-info { color: var(--dim); }
  .log-ok { color: var(--green); }
  .log-err { color: var(--red); }
  .log-out { color: var(--fg); }
  footer {
    padding: 6px 16px; font-size: 12px; color: var(--dim);
    background: var(--panel); border-top: 1px solid var(--border);
  }
  @media (max-width: 720px) { main { flex-direction: column; }
    .editor-pane { border-right: 0; border-bottom: 1px solid var(--border); } }
</style>
</head>
<body>
<header>
  <h1>skjegg <span class="dim">playground</span></h1>
  <label class="sel">language
    <select id="language" title="Pick a language"></select>
  </label>
  <div class="spacer"></div>
  <label class="sel">sample
    <select id="samples" title="Load a sample"></select>
  </label>
  <label class="sel" id="bundleLabel" style="display:none">files
    <select id="bundle" title="View a bundled file (read-only)"></select>
  </label>
  <button id="compileBtn" class="primary" disabled>Compile</button>
  <button id="runBtn" disabled>Run</button>
  <button id="clearBtn">Clear console</button>
</header>
<main>
  <section class="pane editor-pane">
    <div class="pane-head" id="srcLabel">source</div>
    <div class="editor-wrap">
      <div class="gutter" id="gutter">1</div>
      <div class="code-layer">
        <pre id="hl" aria-hidden="true"></pre>
        <textarea id="editor" spellcheck="false" autocomplete="off"
                  autocapitalize="off" autocorrect="off" wrap="off"></textarea>
      </div>
    </div>
  </section>
  <section class="pane console-pane">
    <div class="pane-head">console</div>
    <pre id="console"></pre>
  </section>
</main>
<footer id="status">loading the self-hosted compilers&hellip;</footer>

<script src="highlight.js"></script>
<script>
(function () {
  "use strict";

  // Each language: the self-hosted compiler wasm, whether the compiler emits a
  // complete module (TinScheme) or a relocatable object that the browser then
  // links against runtime objects, and a few sample programs.
  var LANGS = {
    scheme: {
      label: "TinScheme", ext: "scm", compiler: "skj-sc.wasm", tool: "skj-sc",
      link: false, runtime: [],
      note: "A TinScheme program prints with display/newline; its final value " +
            "is also the exit code.",
      samples: {
        "Hello": '(display "Hello from TinScheme!") (newline)\n',
        "Factorial": "; print 6! and return it as the exit code\n" +
          "(define (fact n)\n  (if (= n 0) 1 (* n (fact (- n 1)))))\n" +
          '(display "6! = ") (display (fact 6)) (newline)\n(fact 6)\n',
        "Fibonacci": "(define (fib n)\n  (if (< n 2) n (+ (fib (- n 1)) (fib (- n 2)))))\n" +
          "(define (loop i)\n  (when (< i 10)\n" +
          '    (display "fib(") (display i) (display ") = ") (display (fib i)) (newline)\n' +
          "    (loop (+ i 1))))\n(loop 0)\n",
        "Lists & quote": "; quoted data, list traversal, symbol identity\n" +
          "(define (sum lst)\n  (if (null? lst) 0 (+ (car lst) (sum (cdr lst)))))\n" +
          '(display "sum = ") (display (sum (quote (1 2 3 4 5)))) (newline)\n' +
          '(display (if (eq? (quote red) (quote red)) "same" "diff")) (newline)\n'
      }
    },
    pascal: {
      label: "Pascal", ext: "pas", compiler: "skj-pc.wasm", tool: "skj-pc",
      link: true,
      runtime: [{ url: "rt/pascal_rt.o", name: "pascal_rt.o" }],
      note: "",
      samples: {
        "Hello": "program hello;\nbegin\n  writeln('Hello from Pascal!');\nend.\n",
        "Factorial": "program fact;\nvar i, f: integer;\nbegin\n  f := 1;\n" +
          "  for i := 1 to 6 do\n  begin\n    f := f * i;\n" +
          "    writeln(i, '! = ', f);\n  end;\nend.\n",
        "FizzBuzz": "program fizzbuzz;\nvar i: integer;\nbegin\n" +
          "  for i := 1 to 15 do\n  begin\n" +
          "    if (i mod 15) = 0 then writeln('FizzBuzz')\n" +
          "    else if (i mod 3) = 0 then writeln('Fizz')\n" +
          "    else if (i mod 5) = 0 then writeln('Buzz')\n" +
          "    else writeln(i);\n  end;\nend.\n"
      }
    },
    basic: {
      label: "BASIC", ext: "bas", compiler: "skj-bc.wasm", tool: "skj-bc",
      link: true,
      runtime: [
        { url: "rt/basic_rt.o", name: "basic_rt.o" },
        { url: "rt/arena_wasm.o", name: "arena_wasm.o" }
      ],
      note: "",
      samples: {
        "Hello": 'PRINT "Hello from BASIC!"\n',
        "Squares": 'DIM i AS INT\nFOR i = 1 TO 8\n  PRINT i; " squared is "; i * i\nNEXT\n',
        "FizzBuzz": "DIM i AS INT\nFOR i = 1 TO 15\n" +
          '  IF i MOD 15 = 0 THEN\n    PRINT "FizzBuzz"\n' +
          '  ELSEIF i MOD 3 = 0 THEN\n    PRINT "Fizz"\n' +
          '  ELSEIF i MOD 5 = 0 THEN\n    PRINT "Buzz"\n' +
          "  ELSE\n    PRINT i\n  ENDIF\nNEXT\n"
      }
    },
    moo: {
      label: "MooScript", ext: "moo", compiler: "skj-mooc.wasm", tool: "skj-mooc",
      link: true,
      runtime: [
        { url: "rt/str.o", name: "str.o" },
        { url: "rt/list.o", name: "list.o" },
        { url: "rt/host_stub.o", name: "host_stub.o" },
        { url: "rt/arena_wasm.o", name: "arena_wasm.o" }
      ],
      note: "A MooScript program reports its result as the exit code (watch the " +
            "'exited with code' line).",
      samples: {
        "Arithmetic": "verb add(a: int, b: int)\n\treturn a + b;\nendverb\n\n" +
          "verb main()\n\tvar x: int = 5;\n\tvar y: int = 10;\n" +
          "\treturn add(x, y);\nendverb\n",
        "Max": "verb max(a: int, b: int)\n\tif (a > b)\n\t\treturn a;\n\tendif\n" +
          "\treturn b;\nendverb\n\nverb main()\n\treturn max(42, 17);\nendverb\n"
      }
    },
    c: {
      label: "C", ext: "c", compiler: "skj-cc.wasm", tool: "skj-cc",
      link: true,
      args: ["-Iinclude", "-DSKJ_LIBC_FLOAT"],
      bundle: "bundle/c.json",
      // the full WASM libc, shipped as one gzipped ar archive the link worker
      // unpacks (printf reaches stdout through it)
      archive: "rt/c.a.gz",
      runtime: [],
      note: "C compiles to a WebAssembly object, linked against the bundled libc " +
            "(printf and friends reach the console). The headers come from the " +
            "file bundle; pick one in the 'files' menu to view it read-only.",
      samples: {
        "Hello": '#include <stdio.h>\n\nint main(void) {\n' +
          '    printf("Hello from C!\\n");\n    return 0;\n}\n',
        "Factorial": '#include <stdio.h>\n\nint main(void) {\n' +
          "    long f = 1;\n    for (int i = 1; i <= 6; i++) {\n" +
          "        f *= i;\n" + '        printf("%d! = %ld\\n", i, f);\n' +
          "    }\n    return 0;\n}\n",
        "FizzBuzz": '#include <stdio.h>\n\nint main(void) {\n' +
          "    for (int i = 1; i <= 15; i++) {\n" +
          '        if (i % 15 == 0) printf("FizzBuzz\\n");\n' +
          '        else if (i % 3 == 0) printf("Fizz\\n");\n' +
          '        else if (i % 5 == 0) printf("Buzz\\n");\n' +
          '        else printf("%d\\n", i);\n    }\n    return 0;\n}\n'
      }
    }
  };
  var LANG_ORDER = ["scheme", "pascal", "basic", "moo", "c"];

  var ed = document.getElementById("editor");
  var hl = document.getElementById("hl");
  var gutter = document.getElementById("gutter");
  var out = document.getElementById("console");
  var status = document.getElementById("status");
  var compileBtn = document.getElementById("compileBtn");
  var runBtn = document.getElementById("runBtn");
  var clearBtn = document.getElementById("clearBtn");
  var samples = document.getElementById("samples");
  var bundleSel = document.getElementById("bundle");
  var bundleLabel = document.getElementById("bundleLabel");
  var langSel = document.getElementById("language");
  var srcLabel = document.getElementById("srcLabel");

  var curLang = "scheme";
  var lastModule = null;      // ArrayBuffer of the last runnable module
  var compilerReady = false;
  var busy = false;
  var bundleCache = {};       // url -> { map: {path:content}, files: [{path,...}] }
  var curBundle = null;       // the loaded bundle for curLang (or null)
  var viewing = false;        // showing a bundled file read-only
  var savedSource = null;     // the user's source while viewing a file

  var compiler = new Worker("compiler-worker.js");
  var linker = new Worker("link-worker.js");
  var runner = new Worker("run-worker.js");

  // ---- editor gutter + syntax highlight overlay ----
  function renderHighlight() {
    var html = (self.SkjHighlight && self.SkjHighlight.langs[curLang])
             ? self.SkjHighlight.highlight(ed.value, curLang)
             : ed.value.replace(/&/g, "&amp;").replace(/</g, "&lt;")
                       .replace(/>/g, "&gt;");
    // a trailing newline needs a final rendered line to match the textarea
    hl.innerHTML = html + (ed.value.endsWith("\n") ? "\n" : "");
    hl.scrollTop = ed.scrollTop; hl.scrollLeft = ed.scrollLeft;
  }
  function syncGutter() {
    var n = ed.value.split("\n").length, s = "";
    for (var i = 1; i <= n; i++) s += i + "\n";
    gutter.textContent = s;
    gutter.scrollTop = ed.scrollTop;
  }
  function refreshEditor() { syncGutter(); renderHighlight(); }
  ed.addEventListener("input", function () {
    if (viewing) return;             // a viewed file is read-only
    refreshEditor(); persist(); invalidate();
  });
  ed.addEventListener("scroll", function () {
    gutter.scrollTop = ed.scrollTop;
    hl.scrollTop = ed.scrollTop; hl.scrollLeft = ed.scrollLeft;
  });
  ed.addEventListener("keydown", function (e) {
    if (e.key === "Tab" && !viewing) {       // insert two spaces, no focus loss
      e.preventDefault();
      var s = ed.selectionStart, en = ed.selectionEnd;
      ed.value = ed.value.slice(0, s) + "  " + ed.value.slice(en);
      ed.selectionStart = ed.selectionEnd = s + 2;
      refreshEditor(); persist();
    }
  });

  // ---- console ----
  function log(text, cls) {
    var span = document.createElement("span");
    span.className = cls || "log-out";
    span.textContent = text + (text.endsWith("\n") ? "" : "\n");
    out.appendChild(span);
    out.scrollTop = out.scrollHeight;
  }

  // ---- persistence (per language) ----
  function persist() {
    try { localStorage.setItem("skjegg-pg-" + curLang, ed.value); } catch (e) {}
  }
  function restore(lang) {
    try {
      var v = localStorage.getItem("skjegg-pg-" + lang);
      if (v != null) return v;
    } catch (e) {}
    return null;
  }

  function invalidate() { lastModule = null; runBtn.disabled = true; }

  function setBusy(b) {
    busy = b;
    compileBtn.disabled = b || !compilerReady || viewing;
    runBtn.disabled = b || !lastModule;
    samples.disabled = b;
    bundleSel.disabled = b;
    langSel.disabled = b;
  }

  // ---- file bundles (headers the compiler reads, viewable in the editor) ----
  function ensureBundle(lang) {
    if (!lang.bundle) return Promise.resolve(null);
    if (bundleCache[lang.bundle]) return Promise.resolve(bundleCache[lang.bundle]);
    return fetch(lang.bundle).then(function (r) {
      if (!r.ok) throw new Error(lang.bundle + ": HTTP " + r.status);
      return r.json();
    }).then(function (j) {
      var map = {}, files = j.files || [];
      files.forEach(function (f) { map[f.path] = f.content; });
      var entry = { map: map,
                    files: files.filter(function (f) { return f.editor; }) };
      bundleCache[lang.bundle] = entry;
      return entry;
    });
  }

  // ---- workers ----
  compiler.onmessage = function (ev) {
    var m = ev.data;
    if (m.type === "ready") {
      compilerReady = true; compileBtn.disabled = false;
      status.textContent = "ready - edit, then Compile";
    } else if (m.type === "compiled") {
      if (m.stderr) log(m.stderr, "log-info");
      if (m.link) {
        // relocatable object: link it against the runtime next
        var lang = LANGS[curLang];
        log("Compiled " + m.bytes.byteLength + " bytes; linking…", "log-info");
        status.textContent = "linking…";
        log("$ skj-ld -o out.wasm out.o " + (lang.archive
              ? lang.archive.replace(/^.*\//, "").replace(/\.gz$/, "") + " (archive)"
              : lang.runtime.map(function (r) { return r.name; }).join(" ")),
            "log-info");
        linker.postMessage({
          type: "link", linkerUrl: "skj-ld.wasm", toolName: "skj-ld",
          objBytes: m.bytes, objName: "out.o", outName: "out.wasm",
          runtime: lang.runtime, archive: lang.archive || null
        }, [m.bytes]);
      } else {
        finishBuild(m.bytes);
      }
    } else if (m.type === "error") {
      log(m.stderr || "compile failed", "log-err");
      status.textContent = "compile error"; setBusy(false);
    }
  };

  linker.onmessage = function (ev) {
    var m = ev.data;
    if (m.type === "linked") {
      if (m.stderr) log(m.stderr, "log-info");
      finishBuild(m.bytes);
    } else if (m.type === "error") {
      log(m.stderr || "link failed", "log-err");
      status.textContent = "link error"; setBusy(false);
    }
  };

  function finishBuild(bytes) {
    lastModule = bytes;
    log("Built " + bytes.byteLength + " bytes of WebAssembly.", "log-ok");
    runBtn.disabled = false;
    status.textContent = "built - press Run";
    setBusy(false);
  }

  runner.onmessage = function (ev) {
    var m = ev.data;
    if (m.type === "done") {
      if (m.stdout) log(m.stdout, "log-out");
      if (m.stderr) log(m.stderr, "log-info");
      log("Program exited with code " + m.code + ".", "log-ok");
      status.textContent = "done"; setBusy(false);
    } else if (m.type === "run-error") {
      log("Could not run the module: " + m.message, "log-err");
      if (/stack|tag|instantiate/i.test(m.message))
        log("This program may use delimited continuations, which need a\n" +
            "WasmFX-capable engine; it still compiled correctly.", "log-info");
      status.textContent = "run error"; setBusy(false);
    }
  };

  // ---- actions ----
  compileBtn.addEventListener("click", function () {
    if (!compilerReady || busy || viewing) return;
    var lang = LANGS[curLang];
    setBusy(true); invalidate();
    status.textContent = lang.bundle ? "loading files…" : "compiling…";
    ensureBundle(lang).then(function (bundle) {
      status.textContent = "compiling…";
      var argstr = (lang.args || []).join(" ");
      log("$ " + lang.tool + (argstr ? " " + argstr : "") + " -o " +
          (lang.link ? "out.o" : "out.wasm") + " source." + lang.ext, "log-info");
      compiler.postMessage({
        type: "compile", compilerUrl: lang.compiler, toolName: lang.tool,
        args: lang.args || [], memfs: bundle ? bundle.map : null,
        srcName: "source." + lang.ext, source: ed.value,
        outName: lang.link ? "out.o" : "out.wasm", link: lang.link
      });
    }).catch(function (e) {
      log("Could not load the file bundle: " + String(e), "log-err");
      status.textContent = "bundle error"; setBusy(false);
    });
  });

  runBtn.addEventListener("click", function () {
    if (!lastModule || busy) return;
    setBusy(true);
    status.textContent = "running…";
    log("$ ./out.wasm", "log-info");
    // copy the buffer so the worker transfer does not consume lastModule
    runner.postMessage({ type: "run", wasm: lastModule.slice(0) });
  });

  clearBtn.addEventListener("click", function () { out.textContent = ""; });

  // ---- language + samples ----
  function populateSamples() {
    var lang = LANGS[curLang];
    samples.innerHTML = "";
    Object.keys(lang.samples).forEach(function (name) {
      var o = document.createElement("option");
      o.value = name; o.textContent = name; samples.appendChild(o);
    });
  }

  // ---- bundled-file viewer (read-only) ----
  function exitView() {
    if (!viewing) return;
    viewing = false; ed.readOnly = false;
    if (savedSource != null) ed.value = savedSource;
    savedSource = null;
    srcLabel.textContent = "source." + LANGS[curLang].ext;
    refreshEditor();
    compileBtn.disabled = busy || !compilerReady;
    status.textContent = "ready";
  }
  function populateBundleMenu(entry) {
    bundleSel.innerHTML = "";
    var src = document.createElement("option");
    src.value = ""; src.textContent = "(your source)"; bundleSel.appendChild(src);
    (entry ? entry.files : []).forEach(function (f) {
      var o = document.createElement("option");
      o.value = f.path; o.textContent = f.path; bundleSel.appendChild(o);
    });
    bundleLabel.style.display = (entry && entry.files.length) ? "" : "none";
  }
  bundleSel.addEventListener("change", function () {
    var p = bundleSel.value;
    if (!p) { exitView(); return; }
    if (!curBundle || !(p in curBundle.map)) return;
    if (!viewing) savedSource = ed.value;
    viewing = true;
    ed.value = curBundle.map[p];
    ed.readOnly = true;
    srcLabel.textContent = p + " (read-only)";
    refreshEditor();
    runBtn.disabled = true; compileBtn.disabled = true;
    status.textContent = "viewing a bundled file (read-only)";
  });

  function loadLang(lang, seedSample) {
    exitView();
    curLang = lang;
    var L = LANGS[lang];
    srcLabel.textContent = "source." + L.ext;
    populateSamples();
    var saved = restore(lang);
    if (saved != null && !seedSample) {
      ed.value = saved;
    } else {
      var first = Object.keys(L.samples)[0];
      ed.value = L.samples[first];
      samples.value = first;
    }
    refreshEditor(); invalidate();
    // load the file bundle (if any) for both the compiler memfs and the viewer
    curBundle = null;
    bundleSel.value = "";
    populateBundleMenu(null);
    if (L.bundle) {
      ensureBundle(L).then(function (entry) {
        if (curLang === lang) { curBundle = entry; populateBundleMenu(entry); }
      }).catch(function () { /* surfaced on compile */ });
    }
    if (L.note) log("[" + L.label + "] " + L.note, "log-info");
  }

  LANG_ORDER.forEach(function (id) {
    var o = document.createElement("option");
    o.value = id; o.textContent = LANGS[id].label; langSel.appendChild(o);
  });
  langSel.addEventListener("change", function () {
    exitView();          // restore the real source before persisting it
    persist();
    loadLang(langSel.value, false);
  });
  samples.addEventListener("change", function () {
    var name = samples.value, L = LANGS[curLang];
    if (L.samples[name]) {
      exitView();
      ed.value = L.samples[name]; refreshEditor(); persist(); invalidate();
    }
  });

  // ---- init ----
  compiler.onerror = function (e) {
    status.textContent = "worker error";
    log("Worker failed: " + (e.message || e) + "\nServe this directory over " +
        "http (file:// cannot spawn workers or fetch the modules).", "log-err");
  };
  // The workers signal nothing on start; mark ready once the page is wired, and
  // let the first compile lazily fetch its compiler wasm.
  compilerReady = true;
  compileBtn.disabled = false;
  status.textContent = "ready - pick a language, edit, then Compile";

  langSel.value = "scheme";
  loadLang("scheme", false);
  log("skjegg playground. Each compiler here is skjegg compiling itself to " +
      "WebAssembly: pick a language, press Compile to turn the source into a " +
      ".wasm executable (C, BASIC, Pascal and MooScript are then linked against " +

})();
